<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindSparkle</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="Mode rail">
        <button class="rail-toggle" id="rail-toggle" type="button" title="Modes" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="rail-icons" id="rail-icons" aria-label="Learning modes"></nav>
      </aside>

      <aside class="sidebar" id="sidebar" hidden>
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">Modes</p>
            <h2>Learn</h2>
          </div>
          <button class="ghost" id="sidebar-close" type="button">Close</button>
        </div>
        <div class="mode-list" id="mode-list"></div>
        <div class="sidebar-doc">
          <label for="doc-input">Source document</label>
          <textarea id="doc-input" placeholder="Paste notes, chapter text, or lecture content…"></textarea>
          <div class="sidebar-actions">
            <label class="file-btn">
              Upload .txt
              <input id="file-input" type="file" accept=".txt,text/plain" hidden />
            </label>
            <button class="ghost" id="clear-doc" type="button">Clear</button>
          </div>
        </div>
      </aside>

      <main class="stage">
        <header class="topbar">
          <div>
            <p class="eyebrow">MindSparkle</p>
            <h1 id="mode-title">Chat</h1>
          </div>
          <div class="topbar-meta">
            <span class="pill" id="conn-pill">Connecting…</span>
            <span class="pill mode-pill" id="mode-pill">Summarize</span>
          </div>
        </header>

        <section class="chat" id="chat" aria-live="polite"></section>

        <footer class="composer">
          <div class="composer-box">
            <textarea
              id="prompt-input"
              rows="1"
              placeholder="Ask about your document, or press Run mode…"
            ></textarea>
            <div class="composer-actions">
              <button class="secondary" id="run-mode" type="button">Run mode</button>
              <button class="primary" id="send-btn" type="button">Send</button>
            </div>
          </div>
          <p class="hint" id="hint">Attach a document from the side panel, then run Summarize.</p>
        </footer>
      </main>
    </div>
  </body>
</html>
