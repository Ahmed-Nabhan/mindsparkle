[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-mindsparkle"
version = "0.2.0"
description = "Executa for the mindsparkle Anna App"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0.0",
]

[project.scripts]
"tool-dev-mindsparkle" = "mindsparkle_plugin:main"

[tool.setuptools]
py-modules = ["mindsparkle_plugin"]
