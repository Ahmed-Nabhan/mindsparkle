[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-mindsparkle"
version = "0.1.0"
description = "Executa for the mindsparkle Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-mindsparkle" = "mindsparkle_plugin:main"

[tool.setuptools]
py-modules = ["mindsparkle_plugin"]
